[project]
name = "ppa-reimplementation"
version = "0.1.0"
description = "Unofficial reimplementation of Probabilistic Prompt Adaptation (PPA), reproduced on PARA"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "open-clip-torch>=2.24",
    "pandas>=2.2",
    "pillow>=10.0",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[tool.uv]
# Pin a torch-compatible interpreter; the system Python (3.14) is too new for torch wheels.
python-preference = "managed"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppa"]

[tool.ruff]
line-length = 100
target-version = "py312"